# nginx server block for NoteOS / Threshold.
# Placeholders __DOMAIN__ and __ROOT__ are filled in by deploy.sh --setup-nginx.
# certbot will rewrite this to add the TLS listener on 443.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __ROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets lightly; html stays fresh
    location ~* \.(?:js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # service worker & manifest must revalidate so updates ship immediately
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
